# SearXNG konfiqurasiyası — qaqa-search-api üçün
# Vacib: JSON format aktivdir (API çağırışları üçün)
use_default_settings: true

general:
  instance_name: "Qaqa SearXNG"
  debug: false
  # secret_key-i mütləq dəyiş (aşağıdakı sətri özünə məxsus yaz)
  secret_key: ""   # v44: boş qalır — docker-compose SEARXNG_SECRET-dən götürülür (default şifrə silindi)

server:
  port: 8888
  bind_address: "0.0.0.0"   # konteyner içi (kənara çıxış docker-compose-da 127.0.0.1-ə bağlanır)
  secret_key: ""   # v44: boş qalır — docker-compose SEARXNG_SECRET-dən götürülür (default şifrə silindi)
  limiter: false   # valkey tələb edir; xarici giriş onsuz da bağlıdır (127.0.0.1 mapping)
  image_proxy: true

search:
  safe_search: 0
  autocomplete: ""
  # JSON API aktivdir — search API bunu istifadə edir
  formats:
    - html
    - json

# Axtarış mühərrikləri (70+ mühərrik avtomatik aktivdir)
# Əsas mühərriklər: Google, Bing, DuckDuckGo, Brave, Wikipedia, GitHub
engines:
  - name: google
    engine: google
    shortcut: go
  - name: bing
    engine: bing
    shortcut: bi
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
  - name: brave
    engine: brave
    shortcut: br
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
  - name: github
    engine: github
    shortcut: gh
